[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fab-capacity-planner"
version = "0.1.0"
description = "Capacity planning for a re-entrant semiconductor fab (Intel Mini-Fab): static model, queueing, capex MILP, SimPy DES, and a tool-calling agent with a number validator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "simpy==4.1.1",
    "PuLP==2.9.0",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "llm: needs a local Ollama server (skipped unless FABCAP_LLM_MODEL is set)",
    "slow: longer simulation tests",
]
