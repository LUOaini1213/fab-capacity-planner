name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: "Unit tests (LLM tests are skipped: no Ollama in CI)"
        run: python -m pytest -q
      - name: Static stages reproduce byte-identically
        run: |
          mkdir -p /tmp/results
          # the agent tools read two DES result files; reuse the committed ones as inputs, and do not
          # count them in the comparison (they would trivially match themselves)
          cp results/whatif.json results/des_rules.json /tmp/results/
          python scripts/reproduce.py --stages static,agent --out /tmp/results
          python scripts/compare_results.py results /tmp/results --exclude whatif.json,des_rules.json

  static-windows:
    # a default Windows checkout (core.autocrlf=true) must still byte-compare; guarded by .gitattributes
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: README number checks
        run: python -m pytest -q tests/test_readme_numbers.py
      - name: Static stages reproduce byte-identically on Windows
        run: |
          git config --get core.autocrlf || true
          mkdir -p "$RUNNER_TEMP/results"
          cp results/whatif.json results/des_rules.json "$RUNNER_TEMP/results/"
          python scripts/reproduce.py --stages static,agent --out "$RUNNER_TEMP/results"
          python scripts/compare_results.py results "$RUNNER_TEMP/results" --exclude whatif.json,des_rules.json

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Every mutation must be resolved
        run: python tools/mutation_test.py --out "$RUNNER_TEMP/mutation.json"
      - name: Preserve mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation
          path: ${{ runner.temp }}/mutation.json

  reproduce-des:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Full DES stage reproduces byte-identically
        env:
          FABCAP_WORKERS: "4"
        run: |
          python scripts/reproduce.py --stages des --out /tmp/results
          python scripts/compare_results.py results /tmp/results --only des_
          python scripts/compare_results.py results /tmp/results --only whatif
          python scripts/compare_results.py results /tmp/results --only plan_vs_des
